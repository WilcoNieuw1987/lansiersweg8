<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Lansiersweg 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--green:#1f4d3a;--green-2:#2c6a50;--sand:#f6f1e7;--card:#fff;--ink:#23271f;
    --muted:#6b7163;--terra:#c8643c;--line:#e6ddcd;--ok:#2c6a50;--shadow:0 10px 30px rgba(31,77,58,.08)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--sand);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;line-height:1.55}
  .wrap{max-width:920px;margin:0 auto;padding:0 20px}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15;margin:0}

  /* LOGIN */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--green),var(--green-2));padding:20px}
  .loginbox{background:var(--card);border-radius:20px;padding:36px 30px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .loginbox .lk{font-size:38px}
  .loginbox h1{font-size:30px;margin:6px 0 2px}
  .loginbox p{color:var(--muted);margin:4px 0 18px;font-size:14px}
  .loginbox input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-bottom:10px}
  .loginbox button{width:100%;padding:13px;border:0;border-radius:11px;background:var(--green);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .loginbox button:hover{background:var(--green-2)}
  .loginbox .err{color:#b23b2e;font-size:13.5px;min-height:18px;margin-top:10px}

  /* APP */
  header.hero{background:linear-gradient(160deg,var(--green),var(--green-2));color:#fff;padding:42px 0 36px}
  .pill{display:inline-flex;gap:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:14px}
  .hero h1{font-size:clamp(34px,8vw,60px);color:#fff;letter-spacing:-.5px}
  .hero .addr{font-size:17px;color:rgba(255,255,255,.85);margin-top:6px}
  .countdown{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
  .cd-box{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:11px 17px;min-width:70px;text-align:center}
  .cd-box b{display:block;font-family:Fraunces,serif;font-size:25px;line-height:1}
  .cd-box span{font-size:11px;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.6px}
  .cd-note{margin-top:10px;font-size:13px;color:rgba(255,255,255,.75)}

  nav.tabs{position:sticky;top:0;z-index:10;background:rgba(246,241,231,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding:10px 20px}
  nav.tabs button{flex:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:9px 13px;border-radius:10px;cursor:pointer;white-space:nowrap}
  nav.tabs button:hover{background:#efe8da;color:var(--ink)}
  nav.tabs button.active{background:var(--green);color:#fff}

  main{padding:32px 0 10px}
  section.tab{display:none}
  section.tab.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .eyebrow{color:var(--terra);font-weight:600;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:6px}
  h2{font-size:clamp(22px,4vw,30px);margin-bottom:8px}
  .lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
  h3{font-size:18px;margin:26px 0 12px}

  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .fact .ic{font-size:22px}.fact .lbl{color:var(--muted);font-size:12.5px;margin-top:8px}.fact .val{font-weight:600;font-size:16px;margin-top:2px}
  .badgeA{display:inline-block;background:#1f9d57;color:#fff;font-weight:700;padding:1px 9px;border-radius:6px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-top:6px}
  .list{margin:0;padding-left:20px}.list li{margin:5px 0}
  .tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .tbl td,.tbl th{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px}
  .tbl th{background:#faf7f0;font-weight:600}.tbl .r{text-align:right}.tbl .hl td{font-weight:700;background:#eef4ef;color:var(--green)}

  .chartcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin:14px 0}
  .chartcard h3{margin:0 0 4px;font-size:16px;font-family:Inter,sans-serif;font-weight:600}
  .chartcard p{margin:0 0 12px;color:var(--muted);font-size:13px}
  .chartbox{position:relative;height:260px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}

  .tl{position:relative;margin-left:8px;padding-left:26px;border-left:2px solid var(--line)}
  .tl .step{position:relative;padding:0 0 22px}
  .tl .step::before{content:"";position:absolute;left:-34px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--line)}
  .tl .step.done::before{background:var(--ok);border-color:var(--ok)}
  .tl .step.active::before{background:var(--terra);border-color:var(--terra);box-shadow:0 0 0 5px rgba(200,100,60,.18)}
  .tl .when{font-size:12.5px;color:var(--terra);font-weight:600}
  .tl .step h3{font-size:17px;margin:2px 0 3px}.tl .step p{margin:0;color:var(--muted);font-size:14px}

  .tasks{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 6px;box-shadow:var(--shadow)}
  .task{display:flex;gap:13px;align-items:flex-start;padding:13px 14px;border-radius:10px;cursor:pointer}
  .task+.task{border-top:1px solid var(--line)}.task:hover{background:#faf7f0}
  .task input{appearance:none;width:21px;height:21px;border:2px solid var(--line);border-radius:6px;margin:1px 0 0;flex:none;cursor:pointer;position:relative}
  .task input:checked{background:var(--ok);border-color:var(--ok)}
  .task input:checked::after{content:"✓";color:#fff;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .task label{cursor:pointer;font-size:15px}.task input:checked~label{color:var(--muted);text-decoration:line-through}
  .progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 16px}.progress>i{display:block;height:100%;width:0;background:var(--green-2);transition:width .3s}
  .progress-txt{font-size:13px;color:var(--muted);margin-bottom:8px}
  .note-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .ncard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .ncard h3{font-size:15px;font-family:Inter,sans-serif;font-weight:600;margin:0 0 4px}.ncard p{margin:0;color:var(--muted);font-size:13.5px}
  .alert{background:#fcf0e9;border:1px solid #eccbbb;color:#8a3c25;border-radius:12px;padding:13px 15px;margin:16px 0;font-size:14px}
  footer{padding:28px 0 50px;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--line);margin-top:22px}
  .logout{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>

<div id="login">
  <div class="loginbox">
    <div class="lk">🔒</div>
    <h1>Lansiersweg 8</h1>
    <p>Privé — voer het wachtwoord in</p>
    <input type="password" id="pw" placeholder="Wachtwoord" autocomplete="current-password" />
    <button id="unlock">Openen</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app" style="display:none"></div>

<script>
  window.LW8_ENC = /*ENC_BLOB*/;

  var b = function(s){return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0)})};
  async function decryptApp(pw){
    var E=window.LW8_ENC, enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(E.salt),iterations:E.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.iv)},key,b(E.ct));
    return new TextDecoder().decode(pt);
  }

  function euro(n){return '€ '+n.toLocaleString('nl-NL');}

  function initApp(){
    // Tabs
    var bar=document.getElementById('tabbar');
    if(bar){bar.addEventListener('click',function(e){var x=e.target.closest('button');if(!x)return;
      bar.querySelectorAll('button').forEach(function(z){z.classList.remove('active')});x.classList.add('active');
      document.querySelectorAll('#app section.tab').forEach(function(s){s.classList.remove('active')});
      document.getElementById('tab-'+x.dataset.t).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});});}
    // Countdown
    var cd=document.getElementById('countdown');
    if(cd){var t=new Date('2027-03-02T00:00:00');var f=function(){var d=Math.max(0,Math.floor((t-new Date())/86400000));
      cd.innerHTML='<div class="cd-box"><b>'+d+'</b><span>dagen</span></div><div class="cd-box"><b>'+Math.floor(d/7)+'</b><span>weken</span></div><div class="cd-box"><b>~'+Math.floor(d/30.44)+'</b><span>maanden</span></div>';};f();setInterval(f,3600000);}
    // Tasks
    var boxes=document.querySelectorAll('#tasks input'),pb=document.getElementById('progressBar'),pt=document.getElementById('progressTxt');
    if(boxes.length){var upd=function(){var d=0;boxes.forEach(function(x){if(x.checked)d++});var p=Math.round(d/boxes.length*100);if(pb)pb.style.width=p+'%';if(pt)pt.textContent=d+' van '+boxes.length+' afgerond ('+p+'%)';};
      boxes.forEach(function(x){var s=localStorage.getItem('lw8_'+x.id);if(s!==null)x.checked=(s==='1');x.addEventListener('change',function(){localStorage.setItem('lw8_'+x.id,x.checked?'1':'0');upd();});});upd();}
    // Logout
    var lo=document.getElementById('logout');if(lo)lo.addEventListener('click',function(){location.reload();});
    // Charts
    try{renderCharts();}catch(e){}
  }

  function renderCharts(){
    var el=document.getElementById('chartdata'); if(!el||typeof Chart==='undefined')return;
    var D=JSON.parse(el.textContent);
    var green='#2c6a50', terra='#c8643c', sand='#d9b08c', line='#e6ddcd', ink='#23271f';
    var money={plugins:{legend:{display:false}},scales:{y:{ticks:{callback:function(v){return '€'+v}}}}};
    new Chart(document.getElementById('incomeChart'),{type:'bar',data:{labels:D.income.labels,datasets:[{data:D.income.data,backgroundColor:green,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return '+ €'+c.raw+' netto/mnd'}}}},scales:{y:{ticks:{callback:function(v){return '€'+v}}}}}});
    new Chart(document.getElementById('costChart'),{type:'bar',data:{labels:D.cost.labels,datasets:[{data:D.cost.data,borderRadius:6,backgroundColor:D.cost.data.map(function(v,i){return i===D.cost.data.length-1?terra:(v>0?'#c0573f':green)})}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return (c.raw>0?'+':'')+'€'+c.raw+'/mnd'}}}},scales:{y:{ticks:{callback:function(v){return '€'+v}}}}}});
    new Chart(document.getElementById('overwaardeChart'),{type:'doughnut',data:{labels:D.overwaarde.labels,datasets:[{data:D.overwaarde.data,backgroundColor:[green,terra,sand]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:function(c){return c.label+': €'+c.raw.toLocaleString('nl-NL')}}}}}});
    new Chart(document.getElementById('hypotheekChart'),{type:'doughnut',data:{labels:D.hypotheek.labels,datasets:[{data:D.hypotheek.data,backgroundColor:[green,terra]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:function(c){return c.label+': €'+c.raw.toLocaleString('nl-NL')}}}}}});
  }

  // Login flow
  (function(){
    var btn=document.getElementById('unlock'),pw=document.getElementById('pw'),err=document.getElementById('err');
    async function go(){
      err.textContent='';
      if(!window.crypto||!crypto.subtle){err.textContent='Werkt alleen via de https-link (Vercel).';return;}
      try{
        var html=await decryptApp(pw.value);
        document.getElementById('app').innerHTML=html;
        document.getElementById('login').style.display='none';
        document.getElementById('app').style.display='block';
        initApp();
      }catch(_){err.textContent='Onjuist wachtwoord.';}
    }
    btn.addEventListener('click',go);
    pw.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
    pw.focus();
  })();
</script>
</body>
</html>
